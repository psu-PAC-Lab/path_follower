/turtlebot/path_follower:
  ros__parameters:
    kth: 1. # heading gain
    kt: 0.5 # proportional tangential error gain
    kn: 0.28 # proportional cross-track error gain
    dT: 0.02 # control period
    v_min: 0.1 # speed threshold for low-speed control laws
    logging_file: 'turtlebot_dyn_logging.txt'
    twist_stamped: 0
    use_sim_time: true